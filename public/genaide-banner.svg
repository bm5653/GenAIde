<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="100%" height="100%">
  <!-- Background with subtle warm off-white canvas -->
  <rect width="1000" height="240" fill="#FAF9F6"/>
  
  <!-- Subtle background texture lines -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#F3E8FF" stroke-width="0.75" opacity="0.6"/>
  </pattern>
  <rect width="1000" height="240" fill="url(#grid)" />

  <!-- MASCOT: Purple Robot Head + DNA Helix Body -->
  <g transform="translate(45, 12)">
    <!-- Main Antenna on top -->
    <line x1="45" y1="28" x2="45" y2="10" stroke="#7C3AED" stroke-width="5" stroke-linecap="round"/>
    <circle cx="45" cy="8" r="6" fill="#A855F7"/>

    <!-- Left Ear / Antenna Headphone -->
    <line x1="20" y1="36" x2="8" y2="24" stroke="#6D28D9" stroke-width="4" stroke-linecap="round"/>
    <circle cx="6" cy="22" r="5" fill="#9333EA"/>
    <ellipse cx="14" cy="54" rx="8" ry="14" fill="#581C87"/>
    <ellipse cx="14" cy="54" rx="5" ry="10" fill="#7E22CE"/>

    <!-- Right Ear / Antenna Headphone -->
    <line x1="70" y1="36" x2="82" y2="24" stroke="#6D28D9" stroke-width="4" stroke-linecap="round"/>
    <circle cx="84" cy="22" r="5" fill="#9333EA"/>
    <ellipse cx="76" cy="54" rx="8" ry="14" fill="#581C87"/>
    <ellipse cx="76" cy="54" rx="5" ry="10" fill="#7E22CE"/>

    <!-- Robot Head Outline & Face -->
    <rect x="18" y="24" width="54" height="48" rx="20" fill="#9333EA" stroke="#4C1D95" stroke-width="4.5"/>
    <!-- Face Screen Inner -->
    <rect x="23" y="30" width="44" height="36" rx="14" fill="#E9D5FF"/>
    
    <!-- Eyes (Cute big anime/bot eyes with reflection) -->
    <ellipse cx="34" cy="46" rx="4.5" ry="5.5" fill="#2E1065"/>
    <circle cx="35.5" cy="44" r="1.8" fill="#FFFFFF"/>
    <ellipse cx="56" cy="46" rx="4.5" ry="5.5" fill="#2E1065"/>
    <circle cx="57.5" cy="44" r="1.8" fill="#FFFFFF"/>
    
    <!-- Cheeks (Blush) -->
    <circle cx="28" cy="54" r="2.5" fill="#F472B6" opacity="0.6"/>
    <circle cx="62" cy="54" r="2.5" fill="#F472B6" opacity="0.6"/>

    <!-- Joyful Smile -->
    <path d="M 40 52 Q 45 59 50 52" fill="#BE185D" stroke="#4C1D95" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Neck Connector -->
    <rect x="40" y="72" width="10" height="8" rx="3" fill="#6B21A8"/>

    <!-- DNA Double Helix Lower Body -->
    <!-- Base pair rungs (horizontal lines connecting strands) -->
    <line x1="32" y1="92" x2="58" y2="92" stroke="#6B21A8" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="28" y1="108" x2="62" y2="108" stroke="#7C3AED" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="32" y1="124" x2="58" y2="124" stroke="#8B5CF6" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="26" y1="140" x2="64" y2="140" stroke="#7C3AED" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="30" y1="156" x2="60" y2="156" stroke="#6B21A8" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="28" y1="172" x2="62" y2="172" stroke="#7C3AED" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="32" y1="188" x2="58" y2="188" stroke="#8B5CF6" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Strand 1 (Sine wave twisting left to right) -->
    <path d="M 45 80 C 15 96, 15 120, 45 136 C 75 152, 75 176, 45 194 C 30 202, 30 210, 45 214" 
          fill="none" stroke="#581C87" stroke-width="8" stroke-linecap="round"/>
    <!-- Strand 2 (Sine wave twisting opposite) -->
    <path d="M 45 80 C 75 96, 75 120, 45 136 C 15 152, 15 176, 45 194 C 60 202, 60 210, 45 214" 
          fill="none" stroke="#7C3AED" stroke-width="7" stroke-linecap="round"/>
    
    <!-- Base nodes / rungs highlight -->
    <circle cx="45" cy="80" r="4.5" fill="#C084FC"/>
    <circle cx="45" cy="136" r="4.5" fill="#C084FC"/>
    <circle cx="45" cy="194" r="4.5" fill="#C084FC"/>
  </g>

  <!-- TYPOGRAPHY: GenAIde -->
  <g transform="translate(170, 40)">
    <!-- "Gen" in deep rich purple -->
    <text x="0" y="115" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="124" font-weight="900" fill="#3B0764" letter-spacing="-2">Gen</text>
    
    <!-- "AI" Container with Electronic PCB Traces -->
    <g transform="translate(325, 0)">
      <!-- Base AI Letters in Rich Violet -->
      <text x="0" y="115" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
            font-size="124" font-weight="900" fill="#4C1D95" letter-spacing="-1">AI</text>
      
      <!-- PCB Circuit Overlay Traces on "A" and "I" -->
      <!-- Horizontal and 45-degree circuit tracks -->
      <g stroke="#C084FC" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.95">
        <!-- Leading traces into 'A' -->
        <path d="M -25 35 L 5 35 L 25 55 L 45 55"/>
        <path d="M -20 50 L 10 50 L 30 70 L 50 70"/>
        <path d="M -30 65 L -5 65 L 15 85 L 35 85"/>
        <path d="M -15 80 L 15 80 L 25 90 L 40 90"/>
        <!-- Traces between A and I -->
        <path d="M 60 40 L 75 40 L 85 50 L 105 50"/>
        <path d="M 65 60 L 80 60 L 95 75 L 115 75"/>
        <path d="M 55 75 L 70 75 L 85 90 L 110 90"/>
        <path d="M 70 95 L 90 95 L 100 105 L 120 105"/>
        <!-- Vertical chip bus paths on 'I' -->
        <line x1="126" y1="42" x2="126" y2="105"/>
        <line x1="134" y1="36" x2="134" y2="110"/>
      </g>
      <!-- Solder pads / Nodes on PCB lines -->
      <g fill="#DDD6FE" stroke="#581C87" stroke-width="1.5">
        <circle cx="-25" cy="35" r="3.5"/>
        <circle cx="45" cy="55" r="3"/>
        <circle cx="-20" cy="50" r="3.5"/>
        <circle cx="50" cy="70" r="3"/>
        <circle cx="-30" cy="65" r="3.5"/>
        <circle cx="35" cy="85" r="3"/>
        <circle cx="105" cy="50" r="3"/>
        <circle cx="115" cy="75" r="3"/>
        <circle cx="120" cy="105" r="3"/>
        <circle cx="126" cy="42" r="2.5"/>
        <circle cx="134" cy="110" r="2.5"/>
      </g>
    </g>

    <!-- "de" in deep rich purple -->
    <text x="495" y="115" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="124" font-weight="900" fill="#3B0764" letter-spacing="-2">de</text>
  </g>

  <!-- SUBTITLE: "Your AI-Aided PopGen Tutor" -->
  <text x="195" y="200" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="36" font-weight="800" fill="#3B0764" letter-spacing="0.5">Your AI-Aided PopGen Tutor</text>
</svg>
